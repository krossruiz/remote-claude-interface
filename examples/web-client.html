<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Remote Claude Web Client</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 800px;
      width: 100%;
      height: 600px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      text-align: center;
    }

    .header h1 {
      font-size: 24px;
      font-weight: 600;
    }

    .header p {
      font-size: 14px;
      opacity: 0.9;
      margin-top: 5px;
    }

    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      background: #f7f7f7;
    }

    .message {
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
    }

    .message.user {
      align-items: flex-end;
    }

    .message.assistant {
      align-items: flex-start;
    }

    .message-content {
      max-width: 70%;
      padding: 12px 16px;
      border-radius: 12px;
      word-wrap: break-word;
    }

    .message.user .message-content {
      background: #667eea;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .message.assistant .message-content {
      background: white;
      color: #333;
      border-bottom-left-radius: 4px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .message-label {
      font-size: 12px;
      color: #666;
      margin-bottom: 5px;
      font-weight: 500;
    }

    .input-container {
      padding: 20px;
      background: white;
      border-top: 1px solid #e0e0e0;
      display: flex;
      gap: 10px;
    }

    #messageInput {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.3s;
    }

    #messageInput:focus {
      border-color: #667eea;
    }

    #sendButton {
      padding: 12px 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.3s;
    }

    #sendButton:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    #sendButton:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status {
      padding: 10px 20px;
      background: #fff3cd;
      border-bottom: 1px solid #ffeeba;
      color: #856404;
      font-size: 13px;
      text-align: center;
    }

    .status.connected {
      background: #d4edda;
      border-color: #c3e6cb;
      color: #155724;
    }

    .status.error {
      background: #f8d7da;
      border-color: #f5c6cb;
      color: #721c24;
    }

    .typing-indicator {
      display: flex;
      gap: 5px;
      padding: 12px 16px;
    }

    .typing-dot {
      width: 8px;
      height: 8px;
      background: #999;
      border-radius: 50%;
      animation: typing 1.4s infinite;
    }

    .typing-dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing-dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes typing {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-10px); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Remote Claude</h1>
      <p>Chat with Claude running on your desktop</p>
    </div>

    <div id="status" class="status">Connecting...</div>

    <div id="chatContainer" class="chat-container"></div>

    <div class="input-container">
      <input
        type="text"
        id="messageInput"
        placeholder="Type your message..."
        disabled
      />
      <button id="sendButton" disabled>Send</button>
    </div>
  </div>

  <script type="module">
    // Configuration
    const API_URL = 'http://localhost:3000';
    const API_KEY = 'your-api-key'; // Replace with your API key

    // Simple client implementation (inline for demo)
    class RemoteClaudeClient {
      constructor(config) {
        this.config = config;
      }

      async createSession() {
        const response = await fetch(`${this.config.baseUrl}/api/sessions`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-API-Key': this.config.apiKey,
          },
        });
        return await response.json();
      }

      async chat(message, options = {}) {
        const response = await fetch(`${this.config.baseUrl}/api/chat`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-API-Key': this.config.apiKey,
          },
          body: JSON.stringify({
            sessionId: options.sessionId,
            message,
            stream: options.stream || false,
          }),
        });

        if (options.stream) {
          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          let fullResponse = '';

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            const chunk = decoder.decode(value);
            const lines = chunk.split('\n');

            for (const line of lines) {
              if (line.startsWith('data: ')) {
                const data = JSON.parse(line.slice(6));
                if (data.type === 'token') {
                  fullResponse += data.content;
                  options.onToken?.(data.content);
                } else if (data.type === 'complete') {
                  options.onComplete?.(data.content);
                  return data.content;
                }
              }
            }
          }
          return fullResponse;
        } else {
          const data = await response.json();
          return data.response;
        }
      }
    }

    // Initialize
    const client = new RemoteClaudeClient({
      baseUrl: API_URL,
      apiKey: API_KEY,
    });

    let sessionId = null;
    const chatContainer = document.getElementById('chatContainer');
    const messageInput = document.getElementById('messageInput');
    const sendButton = document.getElementById('sendButton');
    const statusDiv = document.getElementById('status');

    function setStatus(message, type = 'info') {
      statusDiv.textContent = message;
      statusDiv.className = `status ${type}`;
    }

    function addMessage(role, content) {
      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${role}`;

      const label = document.createElement('div');
      label.className = 'message-label';
      label.textContent = role === 'user' ? 'You' : 'Claude';

      const contentDiv = document.createElement('div');
      contentDiv.className = 'message-content';
      contentDiv.textContent = content;

      messageDiv.appendChild(label);
      messageDiv.appendChild(contentDiv);
      chatContainer.appendChild(messageDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;

      return contentDiv;
    }

    function showTypingIndicator() {
      const messageDiv = document.createElement('div');
      messageDiv.className = 'message assistant';
      messageDiv.id = 'typingIndicator';

      const label = document.createElement('div');
      label.className = 'message-label';
      label.textContent = 'Claude';

      const indicator = document.createElement('div');
      indicator.className = 'typing-indicator';
      indicator.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';

      const contentDiv = document.createElement('div');
      contentDiv.className = 'message-content';
      contentDiv.appendChild(indicator);

      messageDiv.appendChild(label);
      messageDiv.appendChild(contentDiv);
      chatContainer.appendChild(messageDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function hideTypingIndicator() {
      const indicator = document.getElementById('typingIndicator');
      if (indicator) {
        indicator.remove();
      }
    }

    async function sendMessage() {
      const message = messageInput.value.trim();
      if (!message) return;

      // Add user message
      addMessage('user', message);
      messageInput.value = '';
      messageInput.disabled = true;
      sendButton.disabled = true;

      // Show typing indicator
      showTypingIndicator();

      try {
        // Create assistant message placeholder
        hideTypingIndicator();
        const assistantContent = addMessage('assistant', '');

        // Stream response
        await client.chat(message, {
          sessionId,
          stream: true,
          onToken: (token) => {
            assistantContent.textContent += token;
            chatContainer.scrollTop = chatContainer.scrollHeight;
          },
          onComplete: () => {
            messageInput.disabled = false;
            sendButton.disabled = false;
            messageInput.focus();
          },
        });
      } catch (error) {
        hideTypingIndicator();
        console.error('Error:', error);
        setStatus(`Error: ${error.message}`, 'error');
        messageInput.disabled = false;
        sendButton.disabled = false;
      }
    }

    // Event listeners
    sendButton.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // Initialize session
    (async () => {
      try {
        setStatus('Creating session...', 'info');
        const session = await client.createSession();
        sessionId = session.sessionId;
        setStatus('Connected and ready!', 'connected');
        messageInput.disabled = false;
        sendButton.disabled = false;
        messageInput.focus();

        // Add welcome message
        addMessage('assistant', 'Hello! I\'m Claude, running on your desktop. How can I help you today?');
      } catch (error) {
        console.error('Initialization error:', error);
        setStatus(`Failed to connect: ${error.message}`, 'error');
      }
    })();
  </script>
</body>
</html>
